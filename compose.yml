services:
  bingo:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:18092:8000"
    volumes:
      - game-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
volumes:
  game-data:
